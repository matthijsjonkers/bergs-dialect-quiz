<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bergs Dialect Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon/icon_192.png">
<meta name="theme-color" content="#111111">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #111;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    user-select: none;
    touch-action: manipulation;
    transition: opacity .25s ease, filter .25s ease;
    padding: 1rem;
  }
  .zone.red { background: #b23127; }
  .zone.green { background: #1e8a4c; }
  .zone.inactive { opacity: .3; filter: grayscale(40%); pointer-events: none; }
  .zone .zone-label { font-size: 1.3rem; line-height: 1.4; max-width: 90%; font-weight: 600; }

  #controlStrip {
    flex: 0 0 auto;
    background: #1c1c1c;
    color: #eee;
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem calc(.5rem + env(safe-area-inset-right, 0px)) .5rem calc(.5rem + env(safe-area-inset-left, 0px));
    min-height: 56px;
    flex-wrap: wrap;
  }
  #controlStrip button {
    background: #333; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: .5rem .75rem; font-size: .95rem; cursor: pointer;
  }
  #controlStrip button:active { background: #444; }
  #controlStrip button:disabled { opacity: .4; cursor: not-allowed; }
  #controlStrip button[hidden] { display: none; }
  #statusText { flex: 1 1 auto; text-align: center; font-size: .95rem; min-width: 120px; }

  #topOverlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: .25rem .5rem;
    padding-top: calc(.25rem + env(safe-area-inset-top, 0px));
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    z-index: 5;
  }
  #scoreOverview {
    font-size: .7rem;
    color: rgba(255,255,255,.75);
    text-align: center;
  }
  #cacheProgressWrap { margin-top: .3rem; }
  #cacheProgressWrap[hidden] { display: none; }
  #cacheProgressText {
    font-size: .65rem;
    color: rgba(255,255,255,.85);
    text-align: center;
    margin-bottom: .15rem;
  }
  #cacheProgressBar {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.2);
    overflow: hidden;
  }
  #cacheProgressFill {
    height: 100%;
    width: 0%;
    background: #3a8;
    transition: width .2s ease;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; padding: 1rem;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: #1c1c1c; color: #eee; border-radius: 10px;
    padding: 1.25rem; max-width: 420px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-content h2 { margin-top: 0; font-size: 1.1rem; }
  .field-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
  .field-row input[type=number] {
    width: 4.5rem; padding: .4rem; border-radius: 6px; border: 1px solid #555;
    background: #111; color: #eee; font-size: 1rem;
  }
  .modal-content > button { margin-top: 1rem; width: 100%; padding: .6rem; }
  #swWarning {
    font-size: .8rem; color: #f0a04b; margin-top: .75rem;
  }
  #swWarning:empty { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="topOverlay">
    <div id="scoreOverview">Laden…</div>
    <div id="cacheProgressWrap" hidden>
      <div id="cacheProgressText"></div>
      <div id="cacheProgressBar"><div id="cacheProgressFill"></div></div>
    </div>
  </div>
  <div id="redZone" class="zone red"><div class="zone-label">NIET GEKEND</div></div>
  <div id="controlStrip">
    <button id="settingsBtn" title="Instellingen">⚙</button>
    <button id="startBtn" disabled>Laden…</button>
    <button id="replayBtn" title="Woord opnieuw afspelen" disabled>🔁</button>
    <div id="statusText">Woorden worden geladen…</div>
    <button id="installBtn" hidden>📲 Installeer app</button>
    <button id="downloadMp3Btn" hidden>⬇️ Mp3's downloaden</button>
  </div>
  <div id="greenZone" class="zone green"><div class="zone-label">GEKEND</div></div>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Instellingen</h2>
    <div class="field-row">
      <label for="pauseInput">Pauze tussen woorden (seconden):</label>
      <input id="pauseInput" type="number" min="0" max="10" step="1" value="1">
    </div>
    <button id="resetProgressBtn">Voortgang wissen (alle woorden opnieuw "niet gekend")</button>
    <button id="exportProgressBtn">Voortgang exporteren naar bestand</button>
    <button id="importProgressBtn">Voortgang importeren uit bestand</button>
    <input id="importProgressInput" type="file" accept="application/json" hidden>
    <button id="forceDownloadBtn">Mp3's nu downloaden (forceren, ongeacht wifi-detectie)</button>
    <div id="debugInfo" style="font-size:.75rem;color:#999;margin-top:.75rem; white-space:pre-line;"></div>
    <div id="swWarning"></div>
    <button id="closeSettingsBtn">Sluiten</button>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Persistente state
  // ---------------------------------------------------------------------
  const STORAGE_KEY = "bergs_quiz_state_v1";
  // Moet gelijk blijven aan MP3_CACHE_NAME in sw.js.
  const MP3_CACHE_NAME = "bergs-quiz-mp3s";

  function loadStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) {
      return {};
    }
  }

  const stored = loadStored();

  const state = {
    pauseMs: (stored.pauseMs != null ? stored.pauseMs : 1000),
    lastResults: stored.lastResults || {},        // wordId -> 'gekend' | 'niet'
    lastRoundCounts: stored.lastRoundCounts || null, // { gekend, niet }
    // Hoeveel mp3's er gedownload zijn wordt bewust NIET opgeslagen: dat
    // getal bleek te kunnen afwijken van de werkelijkheid (afgebroken
    // download) en werd dan toch geloofd. Het wordt nu elke keer opnieuw
    // uit Cache Storage geteld, zie refreshSyncState().
    phase: "idle",       // idle | answering | summary
    queue: [],
    queueIndex: -1,
    currentWord: null,
    roundCounts: { gekend: 0, niet: 0 },
    nextTimer: null,
    session: 0,
    running: false
  };

  let WORDS = [];

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pauseMs: state.pauseMs,
      lastResults: state.lastResults,
      lastRoundCounts: state.lastRoundCounts
    }));
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------
  const redZone = document.getElementById("redZone");
  const greenZone = document.getElementById("greenZone");
  const statusText = document.getElementById("statusText");
  const startBtn = document.getElementById("startBtn");
  const replayBtn = document.getElementById("replayBtn");
  const installBtn = document.getElementById("installBtn");
  const downloadMp3Btn = document.getElementById("downloadMp3Btn");
  const settingsBtn = document.getElementById("settingsBtn");
  const scoreOverview = document.getElementById("scoreOverview");
  const settingsModal = document.getElementById("settingsModal");
  const closeSettingsBtn = document.getElementById("closeSettingsBtn");
  const resetProgressBtn = document.getElementById("resetProgressBtn");
  const exportProgressBtn = document.getElementById("exportProgressBtn");
  const importProgressBtn = document.getElementById("importProgressBtn");
  const importProgressInput = document.getElementById("importProgressInput");
  const forceDownloadBtn = document.getElementById("forceDownloadBtn");
  const debugInfo = document.getElementById("debugInfo");
  const pauseInput = document.getElementById("pauseInput");
  const swWarning = document.getElementById("swWarning");
  const player = document.getElementById("player");
  const cacheProgressWrap = document.getElementById("cacheProgressWrap");
  const cacheProgressText = document.getElementById("cacheProgressText");
  const cacheProgressFill = document.getElementById("cacheProgressFill");

  pauseInput.value = Math.round(state.pauseMs / 1000);

  function updateScoreOverview() {
    const total = WORDS.length;
    let goed = 0, fout = 0;
    Object.keys(state.lastResults).forEach(function (id) {
      if (state.lastResults[id] === "gekend") goed += 1;
      else if (state.lastResults[id] === "niet") fout += 1;
    });
    const ongeoefend = total - goed - fout;
    scoreOverview.textContent =
      total + " woorden · " + goed + " goed, " + fout + " fout, " + ongeoefend + " ongeoefend";
  }

  function setZonesActive(active) {
    redZone.classList.toggle("inactive", !active);
    greenZone.classList.toggle("inactive", !active);
  }
  setZonesActive(false);

  // ---------------------------------------------------------------------
  // Woorden laden
  // ---------------------------------------------------------------------
  fetch("words.json")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      WORDS = data;
      updateScoreOverview();
      startBtn.disabled = false;
      startBtn.textContent = "Start quiz";
      statusText.textContent = "Start de quiz om te beginnen.";
      updateWifiUi();
    })
    .catch(function () {
      statusText.textContent = "Kan words.json niet laden. Open deze app via het serve.js-adres, niet als los bestand.";
      scoreOverview.textContent = "Niet geladen";
    });

  // ---------------------------------------------------------------------
  // Service worker + offline-opslag van de mp3's
  // ---------------------------------------------------------------------
  // Mp3's mogen nooit via mobiel internet (4G/5G) gedownload worden,
  // alleen via wifi — anders gaat dit ten koste van een beperkt databundel.
  //
  // Het downloaden gebeurt hier in de pagina en niet in de service worker:
  // Chrome breekt een service worker af zodra één event langer dan ~5
  // minuten bezig is, en bij ~1800 fragmenten gebeurde dat halverwege.
  // Dat ging stilletjes, waardoor de app dacht klaar te zijn terwijl een
  // deel van de woorden ontbrak — offline kreeg je dan ineens "fragment
  // kon niet geladen worden". Zolang de app open staat loopt het
  // downloaden hier gewoon door.
  function getConnection() {
    return navigator.connection || navigator.webkitConnection || navigator.mozConnection || null;
  }

  // true = bevestigd wifi, false = bevestigd mobiel, null = niet vast te stellen
  // (browser ondersteunt de Network Information API niet).
  function wifiStatus() {
    const c = getConnection();
    if (!c || !c.type) return null;
    return c.type === "wifi";
  }

  const hasCacheStorage = ("caches" in window);

  // Cache Storage bewaart sleutels als absolute url. Overal dezelfde
  // omzetting gebruiken, zodat opslaan en opzoeken gegarandeerd matchen.
  function absUrl(file) {
    return new URL(file, document.baseURI).href;
  }

  function openMp3Cache() {
    return caches.open(MP3_CACHE_NAME);
  }

  // De woorden waarvan de mp3 nog niet in de offline-opslag zit. In één
  // keer alle cache-sleutels opvragen is veel sneller dan per woord een
  // losse match() doen (~1800 stuks).
  function findMissing(cache) {
    return cache.keys().then(function (keys) {
      const have = Object.create(null);
      keys.forEach(function (req) { have[req.url] = true; });
      return WORDS.filter(function (w) { return !have[absUrl(w.file)]; });
    });
  }

  let missingCount = null; // aantal nog ontbrekende fragmenten, null = onbekend

  // Telt wat er écht in de offline-opslag zit. Bewust niet vertrouwen op
  // het onthouden aantal uit localStorage: als een eerdere download
  // halverwege is afgebroken klopt dat getal niet meer, en dan blijft de
  // app ten onrechte denken dat alles binnen is.
  function refreshSyncState() {
    if (!hasCacheStorage || !WORDS.length) return Promise.resolve(null);
    return openMp3Cache()
      .then(findMissing)
      .then(function (missing) {
        missingCount = missing.length;
        return missing;
      })
      .catch(function () { return null; });
  }

  function renderProgress(done, total, opts) {
    const o = opts || {};
    cacheProgressWrap.hidden = false;
    cacheProgressFill.style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
    if (o.finished) {
      cacheProgressText.textContent = "Klaar voor offline gebruik ✔ (" + total + " woorden)";
      setTimeout(function () { cacheProgressWrap.hidden = true; }, 4000);
    } else if (o.stoppedForCellular) {
      cacheProgressText.textContent = "Gepauzeerd (" + done + " / " + total + ") — geen wifi meer, wacht tot wifi terug is.";
    } else if (o.missing) {
      cacheProgressText.textContent =
        o.missing + " van de " + total + " fragmenten ontbreken nog. Tik op \"Mp3's downloaden\" zodra je op wifi zit.";
    } else {
      cacheProgressText.textContent = "Offline voorbereiden: " + done + " / " + total;
    }
  }

  // Voert fn uit voor elk item, met maximaal `limit` gelijktijdig — voorkomt
  // dat we bij duizenden mp3's alles in één keer tegelijk gaan opvragen.
  function mapLimit(items, limit, fn) {
    return new Promise(function (resolve) {
      let index = 0;
      let active = 0;
      let doneCount = 0;

      function next() {
        if (doneCount >= items.length) { resolve(); return; }
        while (active < limit && index < items.length) {
          const item = items[index++];
          active++;
          fn(item).catch(function () {}).then(function () {
            active--;
            doneCount++;
            next();
          });
        }
      }
      next();
    });
  }

  let syncRunning = false;

  async function syncMp3s(force) {
    if (syncRunning || !hasCacheStorage || !WORDS.length) return;
    syncRunning = true;
    let wakeLock = null;
    try {
      // Zonder dit valt het scherm tijdens een lange download in slaap en
      // wordt de pagina afgeknepen, waardoor het downloaden alsnog
      // halverwege blijft steken.
      try {
        if (navigator.wakeLock && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) { /* mag geweigerd worden, dan gewoon door */ }

      const cache = await openMp3Cache();
      const total = WORDS.length;
      const missing = await findMissing(cache);
      let done = total - missing.length;
      let stoppedForCellular = false;

      renderProgress(done, total);

      await mapLimit(missing, 6, async function (word) {
        if (!force && wifiStatus() === false) { stoppedForCellular = true; return; }
        try {
          // De x-mp3-sync-header zorgt dat de service worker dit verzoek
          // doorlaat in plaats van het uit de cache te beantwoorden of te
          // blokkeren; no-store voorkomt dat het bestand óók nog eens in
          // de gewone http-cache belandt.
          const res = await fetch(word.file, {
            headers: { "x-mp3-sync": "1" },
            cache: "no-store"
          });
          if (res.ok) await cache.put(absUrl(word.file), res);
        } catch (e) { /* ontbrekende blijft ontbreken, zie hertelling */ }
        done++;
        if (done % 10 === 0 || done === total) renderProgress(done, total);
      });

      // Hertellen in plaats van de lus-teller geloven: alleen wat echt in
      // de cache staat telt als gedownload.
      const stillMissing = await refreshSyncState();
      if (!stillMissing) return; // cache niet uitleesbaar, niets te melden
      const left = stillMissing.length;
      downloadMp3Btn.hidden = (left === 0);
      renderProgress(total - left, total, {
        finished: left === 0,
        stoppedForCellular: stoppedForCellular && left > 0,
        missing: left
      });
    } finally {
      if (wakeLock) { try { await wakeLock.release(); } catch (e) {} }
      syncRunning = false;
    }
  }

  function updateWifiUi() {
    if (!WORDS.length) return; // woordenlijst nog niet geladen, later opnieuw proberen
    refreshSyncState().then(function (missing) {
      if (missing && missing.length === 0) {
        // Alles staat er echt in — gebruiker niet lastigvallen.
        downloadMp3Btn.hidden = true;
        cacheProgressWrap.hidden = true;
        return;
      }
      if (syncRunning) return; // download loopt al, die werkt de balk zelf bij
      const total = WORDS.length;
      const left = missing ? missing.length : null;
      const status = wifiStatus();
      if (status === true) {
        downloadMp3Btn.hidden = true;
        syncMp3s(false);
        return;
      }
      // De browser denkt dat dit geen wifi is — dat blijkt in de praktijk
      // niet altijd te kloppen (sommige toestellen/netwerken herkennen
      // wifi niet goed). Toon daarom altijd de downloadknop als handmatige
      // overrule, anders zit je vast als de detectie het fout heeft.
      downloadMp3Btn.hidden = false;
      if (left === null) return; // niets zinnigs te melden zonder cache-info
      cacheProgressWrap.hidden = false;
      cacheProgressFill.style.width = Math.round(((total - left) / total) * 100) + "%";
      const conn = getConnection();
      const head = left + " van de " + total + " fragmenten ontbreken nog. ";
      if (conn && conn.type === "none") {
        cacheProgressText.textContent = head + "Je bent nu offline — verbind met wifi om ze op te halen.";
      } else if (status === false) {
        cacheProgressText.textContent = head + "Mobiel internet gedetecteerd, dus ze worden pas opgehaald op wifi. Zit je toch op wifi? Tik dan op \"Mp3's downloaden\".";
      } else {
        cacheProgressText.textContent = head + "Tik op \"Mp3's downloaden\" zodra je op wifi zit.";
      }
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {
      swWarning.textContent = "Service worker kon niet geregistreerd worden — offline gebruik werkt hierdoor nog niet. Controleer de installatie-instructies (Chrome-vlag voor dit adres).";
    });
    // Vraag persistente opslag aan zodat Android/Chrome de gedownloade
    // mp3's niet stilletjes opruimt bij opslagdruk.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    navigator.serviceWorker.ready.then(function () {
      updateWifiUi();
    });

    const connection = getConnection();
    if (connection && connection.addEventListener) {
      connection.addEventListener("change", updateWifiUi);
    }

    downloadMp3Btn.addEventListener("click", function () {
      downloadMp3Btn.hidden = true;
      // Handmatige tik = gebruiker bevestigt zelf dat er wifi is, dus
      // forceren, ook als de browser het (mogelijk verkeerd) als mobiel
      // internet detecteert.
      syncMp3s(true);
    });
  } else {
    swWarning.textContent = "Deze browser ondersteunt geen service workers — offline gebruik is niet mogelijk.";
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function () {
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    });
  });

  // ---------------------------------------------------------------------
  // Geluid (Web Audio, geen bestanden nodig) — voor de ping/buzz tikjes
  // ---------------------------------------------------------------------
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(kind) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;
    if (kind === "ping") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (kind === "buzz") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    }
  }

  // ---------------------------------------------------------------------
  // Woordwachtrij: "niet gekend" komt vaker terug
  // ---------------------------------------------------------------------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildQueue() {
    const list = [];
    WORDS.forEach(function (word) {
      list.push(word);
      const last = state.lastResults[word.id];
      if (last === "niet") { list.push(word); list.push(word); }
    });
    return shuffle(list);
  }

  // ---------------------------------------------------------------------
  // Quiz flow
  // ---------------------------------------------------------------------
  function startQuiz() {
    if (!WORDS.length || state.running) return;
    state.running = true;
    state.session += 1;
    const session = state.session;
    state.roundCounts = { gekend: 0, niet: 0 };
    state.queue = buildQueue();
    state.queueIndex = -1;
    startBtn.textContent = "Stop quiz";
    settingsBtn.disabled = true;
    playNext(session);
  }

  function stopQuiz() {
    state.running = false;
    state.session += 1; // maakt alle nog lopende callbacks van deze sessie ongeldig
    if (state.nextTimer) { clearTimeout(state.nextTimer); state.nextTimer = null; }
    player.pause();
    state.phase = "idle";
    startBtn.textContent = "Start quiz";
    settingsBtn.disabled = false;
    replayBtn.disabled = true;
    setZonesActive(false);
    statusText.textContent = "Quiz gestopt. Start opnieuw wanneer je wil.";
  }

  let currentBlobUrl = null;
  function releaseBlobUrl() {
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  }

  // Leest een gecachet mp3-fragment zelf uit Cache Storage en speelt het af
  // via een Blob-URL, in plaats van player.src rechtstreeks op de mp3-url
  // te zetten. Directe <audio>-fetches lopen via het mediaelement zelf en
  // worden op sommige Android/Chrome-versies niet betrouwbaar door de
  // service worker opgevangen zodra er geen netwerk is — dit omzeilt dat.
  function resolvePlayableSrc(file) {
    if (!hasCacheStorage) return Promise.resolve(file);
    return openMp3Cache()
      .then(function (cache) { return cache.match(absUrl(file)); })
      .then(function (res) { return res ? res.blob() : null; })
      .then(function (blob) { return blob ? URL.createObjectURL(blob) : file; })
      .catch(function () { return file; });
  }

  // Melding als een fragment niet uit de offline-opslag komt. Zegt erbij
  // hoeveel er in totaal ontbreken, zodat meteen duidelijk is of dit één
  // uitschieter is of een half afgebroken download.
  function notDownloadedMessage() {
    if (missingCount) {
      return "Dit fragment is nog niet gedownload — " + missingCount + " van de " +
        WORDS.length + " fragmenten ontbreken. Ga naar ⚙ en tik op \"Mp3's nu downloaden\" met wifi.";
    }
    return "Dit fragment kon niet afgespeeld worden. Ga naar ⚙ voor de download-status.";
  }

  function playCurrent() {
    const word = state.currentWord;
    resolvePlayableSrc(word.file).then(function (src) {
      const fromCache = src.indexOf("blob:") === 0;
      if (state.currentWord !== word) {
        // Ondertussen al doorgegaan naar een ander woord: deze blob-url
        // wordt nooit meer gebruikt, dus meteen opruimen.
        if (fromCache) URL.revokeObjectURL(src);
        return;
      }
      releaseBlobUrl();
      if (fromCache) currentBlobUrl = src;
      player.src = src;
      player.currentTime = 0;
      player.play().catch(function (err) {
        const name = err && err.name;
        if (name === "AbortError") return; // we zijn zelf al verder gegaan
        if (name === "NotAllowedError") {
          statusText.textContent = "Tik ergens op het scherm om afspelen toe te staan.";
        } else if (!fromCache) {
          statusText.textContent = notDownloadedMessage();
        } else {
          statusText.textContent = "Afspelen van dit fragment mislukte (" + (name || "onbekende fout") + ").";
        }
      });
    });
  }

  function playNext(session) {
    if (session !== state.session) return;
    state.queueIndex += 1;
    if (state.queueIndex >= state.queue.length) {
      finishRound(session);
      return;
    }
    state.currentWord = state.queue[state.queueIndex];
    state.phase = "answering";
    setZonesActive(true);
    replayBtn.disabled = false;
    statusText.textContent = "Kies zodra je het weet — hoeft niet te wachten tot het einde.";
    playCurrent();
  }

  player.addEventListener("ended", function () {
    if (state.phase !== "answering") return;
    statusText.textContent = "Kende je dit woord? Tik rood of groen.";
  });

  function registerResult(result, session) {
    if (session !== state.session) return;
    if (state.phase !== "answering") return;
    player.pause();
    setZonesActive(false);
    replayBtn.disabled = true;
    if (result === "gekend") playTone("ping"); else playTone("buzz");

    state.lastResults[state.currentWord.id] = result;
    state.roundCounts[result] += 1;
    saveState();
    updateScoreOverview();

    state.phase = "idle";
    state.nextTimer = setTimeout(function () { playNext(session); }, state.pauseMs);
  }

  function finishRound(session) {
    if (session !== state.session) return;
    state.lastRoundCounts = {
      gekend: state.roundCounts.gekend,
      niet: state.roundCounts.niet
    };
    saveState();
    updateScoreOverview();

    const c = state.roundCounts;
    statusText.textContent = "Beurt klaar: " + c.gekend + " gekend, " + c.niet + " niet gekend.";
    startBtn.textContent = "Start quiz";
    settingsBtn.disabled = false;
    state.phase = "idle";
    state.running = false;
    setZonesActive(false);
    replayBtn.disabled = true;
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------
  function handleZoneTap(result) {
    if (state.phase === "answering") {
      registerResult(result, state.session);
    }
  }

  redZone.addEventListener("click", function () { handleZoneTap("niet"); });
  greenZone.addEventListener("click", function () { handleZoneTap("gekend"); });

  replayBtn.addEventListener("click", function () {
    if (state.phase === "answering" && state.currentWord) playCurrent();
  });

  startBtn.addEventListener("click", function () {
    if (!state.running) startQuiz();
    else stopQuiz();
  });

  function updateDebugInfo() {
    const conn = getConnection();
    const type = conn && conn.type;
    const statusLabel =
      type === "wifi" ? "wifi (bevestigd)" :
      type === "none" ? "geen verbinding" :
      type ? "mobiel internet (bevestigd)" :
      "onbekend";
    const cached = missingCount === null
      ? "onbekend (cache niet uitleesbaar)"
      : (WORDS.length - missingCount) + " / " + WORDS.length + " (" + missingCount + " ontbreken)";
    debugInfo.textContent =
      "Woorden: " + WORDS.length + "\n" +
      "Echt in offline-opslag: " + cached + "\n" +
      "Gedetecteerde verbinding: " + statusLabel + " (connection.type: " + (conn && conn.type ? conn.type : "niet beschikbaar") + ")\n" +
      "Service worker actief: " + (navigator.serviceWorker && navigator.serviceWorker.controller ? "ja" : "nee");
  }

  settingsBtn.addEventListener("click", function () {
    updateDebugInfo();
    settingsModal.classList.remove("hidden");
    // Hertellen kost even; zodra het klaar is staat het juiste aantal er.
    refreshSyncState().then(updateDebugInfo);
  });
  closeSettingsBtn.addEventListener("click", function () {
    settingsModal.classList.add("hidden");
  });

  resetProgressBtn.addEventListener("click", function () {
    state.lastResults = {};
    state.lastRoundCounts = null;
    saveState();
    updateScoreOverview();
    settingsModal.classList.add("hidden");
  });

  exportProgressBtn.addEventListener("click", function () {
    const data = {
      type: "bergs-quiz-voortgang",
      exportedAt: new Date().toISOString(),
      lastResults: state.lastResults,
      lastRoundCounts: state.lastRoundCounts
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "dieje-lekt-voortgang.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importProgressBtn.addEventListener("click", function () {
    importProgressInput.click();
  });

  importProgressInput.addEventListener("change", function () {
    const file = importProgressInput.files[0];
    importProgressInput.value = ""; // zodat hetzelfde bestand later opnieuw gekozen kan worden
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (e) {
        alert("Dit bestand kon niet gelezen worden — is het wel een eerder geëxporteerd voortgangsbestand?");
        return;
      }
      if (!data || typeof data.lastResults !== "object" || data.lastResults === null) {
        alert("Dit bestand bevat geen geldige voortgang.");
        return;
      }
      const count = Object.keys(data.lastResults).length;
      if (!confirm("Dit vervangt je huidige voortgang door de " + count + " woorden uit dit bestand. Doorgaan?")) return;
      state.lastResults = data.lastResults;
      state.lastRoundCounts = data.lastRoundCounts || null;
      saveState();
      updateScoreOverview();
      settingsModal.classList.add("hidden");
      alert("Voortgang geïmporteerd (" + count + " woorden).");
    };
    reader.readAsText(file);
  });

  forceDownloadBtn.addEventListener("click", function () {
    downloadMp3Btn.hidden = true;
    cacheProgressWrap.hidden = false;
    cacheProgressFill.style.width = "0%";
    cacheProgressText.textContent = "Downloaden geforceerd gestart...";
    syncMp3s(true);
    settingsModal.classList.add("hidden");
  });

  pauseInput.addEventListener("change", function () {
    let val = parseInt(pauseInput.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 10) val = 10;
    state.pauseMs = val * 1000;
    pauseInput.value = val;
    saveState();
  });
})();
</script>
</body>
</html>
