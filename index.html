<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bergs Dialect Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon/icon_192.png">
<meta name="theme-color" content="#111111">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #111;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    user-select: none;
    touch-action: manipulation;
    transition: opacity .25s ease, filter .25s ease;
    padding: 1rem;
  }
  .zone.red { background: #b23127; }
  .zone.green { background: #1e8a4c; }
  .zone.inactive { opacity: .3; filter: grayscale(40%); pointer-events: none; }
  .zone .zone-label { font-size: 1.3rem; line-height: 1.4; max-width: 90%; font-weight: 600; }

  #controlStrip {
    flex: 0 0 auto;
    background: #1c1c1c;
    color: #eee;
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem calc(.5rem + env(safe-area-inset-right, 0px)) .5rem calc(.5rem + env(safe-area-inset-left, 0px));
    min-height: 56px;
    flex-wrap: wrap;
  }
  #controlStrip button {
    background: #333; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: .5rem .75rem; font-size: .95rem; cursor: pointer;
  }
  #controlStrip button:active { background: #444; }
  #controlStrip button:disabled { opacity: .4; cursor: not-allowed; }
  #controlStrip button[hidden] { display: none; }
  #controlStrip button.on { background: #1e8a4c; border-color: #2fb86b; color: #fff; }
  #statusText { flex: 1 1 auto; text-align: center; font-size: .95rem; min-width: 120px; }

  #topOverlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: .25rem .5rem;
    padding-top: calc(.25rem + env(safe-area-inset-top, 0px));
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    z-index: 5;
  }
  #scoreOverview {
    font-size: .7rem;
    color: rgba(255,255,255,.75);
    text-align: center;
  }
  #voiceHint {
    font-size: .7rem;
    color: rgba(255,255,255,.75);
    text-align: center;
    margin-top: .15rem;
  }
  #voiceHint:empty { display: none; }
  #cacheProgressWrap { margin-top: .3rem; }
  #cacheProgressWrap[hidden] { display: none; }
  #cacheProgressText {
    font-size: .65rem;
    color: rgba(255,255,255,.85);
    text-align: center;
    margin-bottom: .15rem;
  }
  #cacheProgressBar {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.2);
    overflow: hidden;
  }
  #cacheProgressFill {
    height: 100%;
    width: 0%;
    background: #3a8;
    transition: width .2s ease;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; padding: 1rem;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: #1c1c1c; color: #eee; border-radius: 10px;
    padding: 1.25rem; max-width: 420px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-content h2 { margin-top: 0; font-size: 1.1rem; }
  .field-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
  .field-row input[type=number] {
    width: 4.5rem; padding: .4rem; border-radius: 6px; border: 1px solid #555;
    background: #111; color: #eee; font-size: 1rem;
  }
  .modal-content > button { margin-top: 1rem; width: 100%; padding: .6rem; }
  #swWarning {
    font-size: .8rem; color: #f0a04b; margin-top: .75rem;
  }
  #swWarning:empty { display: none; }

  #updateModal p { font-size: .9rem; line-height: 1.45; color: #ccc; margin: 0; }
  #updateNowBtn {
    background: #1e8a4c; color: #fff; border: 1px solid #2fb86b;
    border-radius: 6px; font-size: 1rem; font-weight: 600;
  }
  #updateLaterBtn {
    background: #333; color: #eee; border: 1px solid #555;
    border-radius: 6px; font-size: .95rem;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topOverlay">
    <div id="scoreOverview">Laden…</div>
    <div id="voiceHint"></div>
    <div id="cacheProgressWrap" hidden>
      <div id="cacheProgressText"></div>
      <div id="cacheProgressBar"><div id="cacheProgressFill"></div></div>
    </div>
  </div>
  <div id="redZone" class="zone red"><div class="zone-label">NIET GEKEND</div></div>
  <div id="controlStrip">
    <button id="settingsBtn" title="Instellingen">⚙</button>
    <button id="startBtn" disabled>Laden…</button>
    <button id="replayBtn" title="Woord opnieuw afspelen" disabled>🔁</button>
    <button id="voiceBtn" title="Spraakbediening: antwoord met &quot;ja&quot; of &quot;nee&quot;" hidden>🎤</button>
    <div id="statusText">Woorden worden geladen…</div>
    <button id="installBtn" hidden>📲 Installeer app</button>
    <button id="downloadMp3Btn" hidden>⬇️ Mp3's downloaden</button>
  </div>
  <div id="greenZone" class="zone green"><div class="zone-label">GEKEND</div></div>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Instellingen</h2>
    <div class="field-row">
      <label for="pauseInput">Pauze tussen woorden (seconden):</label>
      <input id="pauseInput" type="number" min="0" max="10" step="1" value="1">
    </div>
    <button id="resetProgressBtn">Voortgang wissen (alle woorden opnieuw "niet gekend")</button>
    <button id="exportProgressBtn">Voortgang exporteren naar bestand</button>
    <button id="importProgressBtn">Voortgang importeren uit bestand</button>
    <input id="importProgressInput" type="file" accept="application/json" hidden>
    <button id="forceDownloadBtn">Mp3's nu downloaden (forceren, ongeacht wifi-detectie)</button>
    <div id="voiceInfo" style="font-size:.8rem;color:#aaa;margin-top:.75rem;"></div>
    <div id="debugInfo" style="font-size:.75rem;color:#999;margin-top:.75rem; white-space:pre-line;"></div>
    <div id="voiceLogInfo" style="font-size:.7rem;color:#888;margin-top:.75rem;white-space:pre-line;font-family:ui-monospace,Consolas,monospace;"></div>
    <div id="swWarning"></div>
    <button id="closeSettingsBtn">Sluiten</button>
  </div>
</div>

<div id="updateModal" class="modal hidden">
  <div class="modal-content">
    <h2>Nieuwe versie beschikbaar</h2>
    <p>Er staat een nieuwe versie van de quiz klaar. Bijwerken duurt een
       paar seconden en de app herstart daarna even. Je voortgang en de
       gedownloade fragmenten blijven gewoon staan.</p>
    <button id="updateNowBtn">Nu bijwerken</button>
    <button id="updateLaterBtn">Later</button>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Persistente state
  // ---------------------------------------------------------------------
  const STORAGE_KEY = "bergs_quiz_state_v1";
  // Moet gelijk blijven aan MP3_CACHE_NAME in sw.js.
  const MP3_CACHE_NAME = "bergs-quiz-mp3s";

  function loadStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) {
      return {};
    }
  }

  const stored = loadStored();

  const state = {
    pauseMs: (stored.pauseMs != null ? stored.pauseMs : 1000),
    voiceEnabled: stored.voiceEnabled === true,   // handsfree antwoorden met "ja"/"nee"
    lastResults: stored.lastResults || {},        // wordId -> 'gekend' | 'niet'
    lastRoundCounts: stored.lastRoundCounts || null, // { gekend, niet }
    // Hoeveel mp3's er gedownload zijn wordt bewust NIET opgeslagen: dat
    // getal bleek te kunnen afwijken van de werkelijkheid (afgebroken
    // download) en werd dan toch geloofd. Het wordt nu elke keer opnieuw
    // uit Cache Storage geteld, zie refreshSyncState().
    phase: "idle",       // idle | answering | summary
    queue: [],
    queueIndex: -1,
    currentWord: null,
    roundCounts: { gekend: 0, niet: 0 },
    nextTimer: null,
    session: 0,
    running: false
  };

  let WORDS = [];

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pauseMs: state.pauseMs,
      voiceEnabled: state.voiceEnabled,
      lastResults: state.lastResults,
      lastRoundCounts: state.lastRoundCounts
    }));
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------
  const redZone = document.getElementById("redZone");
  const greenZone = document.getElementById("greenZone");
  const statusText = document.getElementById("statusText");
  const startBtn = document.getElementById("startBtn");
  const replayBtn = document.getElementById("replayBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const voiceHint = document.getElementById("voiceHint");
  const voiceInfo = document.getElementById("voiceInfo");
  const installBtn = document.getElementById("installBtn");
  const downloadMp3Btn = document.getElementById("downloadMp3Btn");
  const settingsBtn = document.getElementById("settingsBtn");
  const scoreOverview = document.getElementById("scoreOverview");
  const settingsModal = document.getElementById("settingsModal");
  const closeSettingsBtn = document.getElementById("closeSettingsBtn");
  const updateModal = document.getElementById("updateModal");
  const updateNowBtn = document.getElementById("updateNowBtn");
  const updateLaterBtn = document.getElementById("updateLaterBtn");
  const resetProgressBtn = document.getElementById("resetProgressBtn");
  const exportProgressBtn = document.getElementById("exportProgressBtn");
  const importProgressBtn = document.getElementById("importProgressBtn");
  const importProgressInput = document.getElementById("importProgressInput");
  const forceDownloadBtn = document.getElementById("forceDownloadBtn");
  const debugInfo = document.getElementById("debugInfo");
  const voiceLogInfo = document.getElementById("voiceLogInfo");
  const pauseInput = document.getElementById("pauseInput");
  const swWarning = document.getElementById("swWarning");
  const player = document.getElementById("player");
  const cacheProgressWrap = document.getElementById("cacheProgressWrap");
  const cacheProgressText = document.getElementById("cacheProgressText");
  const cacheProgressFill = document.getElementById("cacheProgressFill");

  pauseInput.value = Math.round(state.pauseMs / 1000);

  function updateScoreOverview() {
    const total = WORDS.length;
    let goed = 0, fout = 0;
    Object.keys(state.lastResults).forEach(function (id) {
      if (state.lastResults[id] === "gekend") goed += 1;
      else if (state.lastResults[id] === "niet") fout += 1;
    });
    const ongeoefend = total - goed - fout;
    scoreOverview.textContent =
      total + " woorden · " + goed + " goed, " + fout + " fout, " + ongeoefend + " ongeoefend";
  }

  function setZonesActive(active) {
    redZone.classList.toggle("inactive", !active);
    greenZone.classList.toggle("inactive", !active);
  }
  setZonesActive(false);

  // ---------------------------------------------------------------------
  // Woorden laden
  // ---------------------------------------------------------------------
  fetch("words.json")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      WORDS = data;
      updateScoreOverview();
      startBtn.disabled = false;
      startBtn.textContent = "Start quiz";
      statusText.textContent = "Start de quiz om te beginnen.";
      updateWifiUi();
    })
    .catch(function () {
      statusText.textContent = "Kan words.json niet laden. Open deze app via het serve.js-adres, niet als los bestand.";
      scoreOverview.textContent = "Niet geladen";
    });

  // ---------------------------------------------------------------------
  // Service worker + offline-opslag van de mp3's
  // ---------------------------------------------------------------------
  // Mp3's mogen nooit via mobiel internet (4G/5G) gedownload worden,
  // alleen via wifi — anders gaat dit ten koste van een beperkt databundel.
  //
  // Het downloaden gebeurt hier in de pagina en niet in de service worker:
  // Chrome breekt een service worker af zodra één event langer dan ~5
  // minuten bezig is, en bij ~1800 fragmenten gebeurde dat halverwege.
  // Dat ging stilletjes, waardoor de app dacht klaar te zijn terwijl een
  // deel van de woorden ontbrak — offline kreeg je dan ineens "fragment
  // kon niet geladen worden". Zolang de app open staat loopt het
  // downloaden hier gewoon door.
  function getConnection() {
    return navigator.connection || navigator.webkitConnection || navigator.mozConnection || null;
  }

  // true = bevestigd wifi, false = bevestigd mobiel, null = niet vast te stellen
  // (browser ondersteunt de Network Information API niet).
  function wifiStatus() {
    const c = getConnection();
    if (!c || !c.type) return null;
    return c.type === "wifi";
  }

  const hasCacheStorage = ("caches" in window);

  // Cache Storage bewaart sleutels als absolute url. Overal dezelfde
  // omzetting gebruiken, zodat opslaan en opzoeken gegarandeerd matchen.
  function absUrl(file) {
    return new URL(file, document.baseURI).href;
  }

  function openMp3Cache() {
    return caches.open(MP3_CACHE_NAME);
  }

  // De woorden waarvan de mp3 nog niet in de offline-opslag zit. In één
  // keer alle cache-sleutels opvragen is veel sneller dan per woord een
  // losse match() doen (~1800 stuks).
  function findMissing(cache) {
    return cache.keys().then(function (keys) {
      const have = Object.create(null);
      keys.forEach(function (req) { have[req.url] = true; });
      return WORDS.filter(function (w) { return !have[absUrl(w.file)]; });
    });
  }

  let missingCount = null; // aantal nog ontbrekende fragmenten, null = onbekend

  // Telt wat er écht in de offline-opslag zit. Bewust niet vertrouwen op
  // het onthouden aantal uit localStorage: als een eerdere download
  // halverwege is afgebroken klopt dat getal niet meer, en dan blijft de
  // app ten onrechte denken dat alles binnen is.
  function refreshSyncState() {
    if (!hasCacheStorage || !WORDS.length) return Promise.resolve(null);
    return openMp3Cache()
      .then(findMissing)
      .then(function (missing) {
        missingCount = missing.length;
        return missing;
      })
      .catch(function () { return null; });
  }

  function renderProgress(done, total, opts) {
    const o = opts || {};
    cacheProgressWrap.hidden = false;
    cacheProgressFill.style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
    if (o.finished) {
      cacheProgressText.textContent = "Klaar voor offline gebruik ✔ (" + total + " woorden)";
      setTimeout(function () { cacheProgressWrap.hidden = true; }, 4000);
    } else if (o.stoppedForCellular) {
      cacheProgressText.textContent = "Gepauzeerd (" + done + " / " + total + ") — geen wifi meer, wacht tot wifi terug is.";
    } else if (o.missing) {
      cacheProgressText.textContent =
        o.missing + " van de " + total + " fragmenten ontbreken nog. Tik op \"Mp3's downloaden\" zodra je op wifi zit.";
    } else {
      cacheProgressText.textContent = "Offline voorbereiden: " + done + " / " + total;
    }
  }

  // Voert fn uit voor elk item, met maximaal `limit` gelijktijdig — voorkomt
  // dat we bij duizenden mp3's alles in één keer tegelijk gaan opvragen.
  function mapLimit(items, limit, fn) {
    return new Promise(function (resolve) {
      let index = 0;
      let active = 0;
      let doneCount = 0;

      function next() {
        if (doneCount >= items.length) { resolve(); return; }
        while (active < limit && index < items.length) {
          const item = items[index++];
          active++;
          fn(item).catch(function () {}).then(function () {
            active--;
            doneCount++;
            next();
          });
        }
      }
      next();
    });
  }

  let syncRunning = false;

  async function syncMp3s(force) {
    if (syncRunning || !hasCacheStorage || !WORDS.length) return;
    syncRunning = true;
    let wakeLock = null;
    try {
      // Zonder dit valt het scherm tijdens een lange download in slaap en
      // wordt de pagina afgeknepen, waardoor het downloaden alsnog
      // halverwege blijft steken.
      try {
        if (navigator.wakeLock && document.visibilityState === "visible") {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) { /* mag geweigerd worden, dan gewoon door */ }

      const cache = await openMp3Cache();
      const total = WORDS.length;
      const missing = await findMissing(cache);
      let done = total - missing.length;
      let stoppedForCellular = false;

      renderProgress(done, total);

      await mapLimit(missing, 6, async function (word) {
        if (!force && wifiStatus() === false) { stoppedForCellular = true; return; }
        try {
          // De x-mp3-sync-header zorgt dat de service worker dit verzoek
          // doorlaat in plaats van het uit de cache te beantwoorden of te
          // blokkeren; no-store voorkomt dat het bestand óók nog eens in
          // de gewone http-cache belandt.
          const res = await fetch(word.file, {
            headers: { "x-mp3-sync": "1" },
            cache: "no-store"
          });
          if (res.ok) await cache.put(absUrl(word.file), res);
        } catch (e) { /* ontbrekende blijft ontbreken, zie hertelling */ }
        done++;
        if (done % 10 === 0 || done === total) renderProgress(done, total);
      });

      // Hertellen in plaats van de lus-teller geloven: alleen wat echt in
      // de cache staat telt als gedownload.
      const stillMissing = await refreshSyncState();
      if (!stillMissing) return; // cache niet uitleesbaar, niets te melden
      const left = stillMissing.length;
      downloadMp3Btn.hidden = (left === 0);
      renderProgress(total - left, total, {
        finished: left === 0,
        stoppedForCellular: stoppedForCellular && left > 0,
        missing: left
      });
    } finally {
      if (wakeLock) { try { await wakeLock.release(); } catch (e) {} }
      syncRunning = false;
      // Kwam er tijdens het downloaden een update klaar te staan, dan nu pas
      // vragen — herladen zou de download afgebroken hebben.
      showPendingUpdatePrompt();
    }
  }

  function updateWifiUi() {
    if (!WORDS.length) return; // woordenlijst nog niet geladen, later opnieuw proberen
    refreshSyncState().then(function (missing) {
      if (missing && missing.length === 0) {
        // Alles staat er echt in — gebruiker niet lastigvallen.
        downloadMp3Btn.hidden = true;
        cacheProgressWrap.hidden = true;
        return;
      }
      if (syncRunning) return; // download loopt al, die werkt de balk zelf bij
      const total = WORDS.length;
      const left = missing ? missing.length : null;
      const status = wifiStatus();
      if (status === true) {
        downloadMp3Btn.hidden = true;
        syncMp3s(false);
        return;
      }
      // De browser denkt dat dit geen wifi is — dat blijkt in de praktijk
      // niet altijd te kloppen (sommige toestellen/netwerken herkennen
      // wifi niet goed). Toon daarom altijd de downloadknop als handmatige
      // overrule, anders zit je vast als de detectie het fout heeft.
      downloadMp3Btn.hidden = false;
      if (left === null) return; // niets zinnigs te melden zonder cache-info
      cacheProgressWrap.hidden = false;
      cacheProgressFill.style.width = Math.round(((total - left) / total) * 100) + "%";
      const conn = getConnection();
      const head = left + " van de " + total + " fragmenten ontbreken nog. ";
      if (conn && conn.type === "none") {
        cacheProgressText.textContent = head + "Je bent nu offline — verbind met wifi om ze op te halen.";
      } else if (status === false) {
        cacheProgressText.textContent = head + "Mobiel internet gedetecteerd, dus ze worden pas opgehaald op wifi. Zit je toch op wifi? Tik dan op \"Mp3's downloaden\".";
      } else {
        cacheProgressText.textContent = head + "Tik op \"Mp3's downloaden\" zodra je op wifi zit.";
      }
    });
  }

  // ---------------------------------------------------------------------
  // Bijwerken naar een nieuwe versie
  // ---------------------------------------------------------------------
  // Omdat alles cache-first geserveerd wordt, blijft de app anders
  // onbeperkt de oude index.html tonen. Een nieuwe service worker
  // installeert zichzelf wel op de achtergrond, maar blijft bewust wachten
  // (sw.js doet geen skipWaiting). Hier merken we dat, vragen we het de
  // gebruiker, en nemen we hem daarna in gebruik + herladen we de pagina.
  // Zonder die vraag zou de app midden in een beurt vervangen worden.
  let waitingWorker = null;        // de klaarstaande nieuwe versie
  let updatePromptPending = false; // versie klaar, maar nu even niet storen
  let updateInProgress = false;    // "Nu bijwerken" aangetikt, wacht op herladen
  let reloadStarted = false;

  // Niet met de vraag binnenvallen tijdens een lopende beurt of een lopende
  // mp3-download: herladen zou allebei halverwege afbreken.
  function mayInterrupt() {
    return !state.running && !syncRunning;
  }

  function newVersionReady(worker) {
    if (!worker || updateInProgress) return;
    waitingWorker = worker;
    if (mayInterrupt()) showUpdatePrompt();
    else updatePromptPending = true;
  }

  function showUpdatePrompt() {
    if (!waitingWorker || updateInProgress) return;
    updatePromptPending = false;
    updateModal.classList.remove("hidden");
  }

  // Aangeroepen zodra een beurt of een download klaar is: een update die
  // ondertussen klaarkwam alsnog aanbieden.
  function showPendingUpdatePrompt() {
    if (updatePromptPending && mayInterrupt()) showUpdatePrompt();
  }

  function reloadForUpdate() {
    if (reloadStarted) return;
    reloadStarted = true;
    location.reload();
  }

  function applyUpdate() {
    if (!waitingWorker) return;
    updateInProgress = true;
    updateModal.classList.add("hidden");
    statusText.textContent = "Bijwerken…";
    waitingWorker.postMessage({ type: "SKIP_WAITING" });
    // Zodra de nieuwe versie het overneemt komt "controllerchange" binnen
    // en herladen we. Vangnet voor als dat onverhoopt uitblijft, zodat de
    // app niet op "Bijwerken…" blijft hangen:
    setTimeout(reloadForUpdate, 5000);
  }

  function watchForUpdates(reg) {
    if (!reg) return;

    // Stond er al een versie klaar van een vorige keer dat de app openstond?
    if (reg.waiting && navigator.serviceWorker.controller) newVersionReady(reg.waiting);

    reg.addEventListener("updatefound", function () {
      const installing = reg.installing;
      if (!installing) return;
      installing.addEventListener("statechange", function () {
        // Zonder controller is dit de allereerste installatie — dan valt er
        // niets te vervangen en hoeft er dus ook niets gevraagd te worden.
        if (installing.state === "installed" && navigator.serviceWorker.controller) {
          newVersionReady(installing);
        }
      });
    });

    // De browser kijkt uit zichzelf alleen bij het openen van de app of er
    // een nieuwe sw.js is (en hooguit eens per 24 uur). Wie de app lang open
    // laat staan zou een update dus niet zien; daarom zelf kijken zodra de
    // app weer op de voorgrond komt, en periodiek. De throttle voorkomt een
    // netwerkverzoek bij elke keer wisselen tussen apps.
    let lastCheck = 0;
    function checkForUpdate() {
      if (!navigator.onLine) return;
      const now = Date.now();
      if (now - lastCheck < 15 * 60 * 1000) return;
      lastCheck = now;
      reg.update().catch(function () { /* offline of server onbereikbaar */ });
    }
    setInterval(checkForUpdate, 60 * 60 * 1000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") checkForUpdate();
    });
  }

  updateNowBtn.addEventListener("click", applyUpdate);
  updateLaterBtn.addEventListener("click", function () {
    updateModal.classList.add("hidden");
    // Niet in deze sessie blijven zeuren; bij de volgende keer openen staat
    // de versie nog steeds klaar (reg.waiting) en wordt het opnieuw gevraagd.
    updatePromptPending = false;
  });

  // Versie van de actieve service worker, zodat in ⚙ te zien is of een
  // update echt doorgekomen is.
  let activeVersion = null;
  function askActiveVersion() {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw || !window.MessageChannel) return;
    const channel = new MessageChannel();
    channel.port1.onmessage = function (e) {
      activeVersion = e.data;
      updateDebugInfo();
    };
    sw.postMessage({ type: "GET_VERSION" }, [channel.port2]);
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js")
      .then(watchForUpdates)
      .catch(function () {
        swWarning.textContent = "Service worker kon niet geregistreerd worden — offline gebruik werkt hierdoor nog niet. Controleer de installatie-instructies (Chrome-vlag voor dit adres).";
      });
    // Vraag persistente opslag aan zodat Android/Chrome de gedownloade
    // mp3's niet stilletjes opruimt bij opslagdruk.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // Vuurt ook bij de allereerste installatie (clients.claim); alleen
    // herladen als wij het zelf in gang gezet hebben.
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (updateInProgress) reloadForUpdate();
    });

    navigator.serviceWorker.ready.then(function () {
      updateWifiUi();
      askActiveVersion();
    });

    const connection = getConnection();
    if (connection && connection.addEventListener) {
      connection.addEventListener("change", updateWifiUi);
    }

    downloadMp3Btn.addEventListener("click", function () {
      downloadMp3Btn.hidden = true;
      // Handmatige tik = gebruiker bevestigt zelf dat er wifi is, dus
      // forceren, ook als de browser het (mogelijk verkeerd) als mobiel
      // internet detecteert.
      syncMp3s(true);
    });
  } else {
    swWarning.textContent = "Deze browser ondersteunt geen service workers — offline gebruik is niet mogelijk.";
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function () {
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    });
  });

  // ---------------------------------------------------------------------
  // Geluid (Web Audio, geen bestanden nodig) — voor de ping/buzz tikjes
  // ---------------------------------------------------------------------
  // De AudioContext ontstaat bij het eerste tikje — dus bij het eerste
  // antwoord — en bleef daarna draaien. Een lopende AudioContext houdt op
  // Android een uitgang open, en dat botst met de spraakherkenner, die de
  // audiofocus wil. Vanaf het tweede woord was de microfoon daardoor de
  // verliezer. Hem na elk tikje weer laten slapen lost dat op.
  let audioCtx = null;
  let audioSuspendTimer = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioSuspendTimer) { clearTimeout(audioSuspendTimer); audioSuspendTimer = null; }
    if (audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }

  function suspendAudioCtxSoon() {
    if (audioSuspendTimer) clearTimeout(audioSuspendTimer);
    audioSuspendTimer = setTimeout(function () {
      audioSuspendTimer = null;
      if (audioCtx && audioCtx.state === "running") {
        try { audioCtx.suspend(); } catch (e) {}
      }
    }, 700); // ruim na het langste tikje (0,45 s)
  }

  function playTone(kind) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;
    if (kind === "ping") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (kind === "buzz") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    }
    suspendAudioCtxSoon();
  }

  // ---------------------------------------------------------------------
  // Spraakbediening: "ja" / "nee" in plaats van rood/groen tikken
  // ---------------------------------------------------------------------
  // Bedoeld voor gebruik in de auto: handen aan het stuur, antwoorden met
  // je stem. "ja" telt als GEKEND, "nee" als NIET GEKEND. Tikken blijft
  // gewoon werken; de microfoon is een extra manier van antwoorden.
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  // Bewust een korte, strakke woordenlijst. Hoe meer synoniemen ("goed",
  // "niet", "geen idee"), hoe groter de kans dat de microfoon het
  // afgespeelde fragment zelf opvangt en dat als antwoord telt.
  const JA_WOORDEN = { ja: 1, jah: 1, jaa: 1, jawel: 1, yes: 1, yep: 1 };
  const NEE_WOORDEN = { nee: 1, neen: 1, neeh: 1, neu: 1, no: 1, nope: 1 };

  // Een bewust antwoord is kort. Komt er een langere zin binnen, dan is dat
  // gepraat in de auto en geen antwoord — negeren, ook als er toevallig
  // "ja" of "nee" in staat.
  const MAX_ANTWOORD_WOORDEN = 3;

  function tokenize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[^a-zà-ÿ]+/g, " ")
      .trim()
      .split(" ")
      .filter(Boolean);
  }

  // Zoekt van achter naar voren: bij "ja, eh, nee" geldt het laatste woord.
  function findAnswer(tokens) {
    for (let i = tokens.length - 1; i >= 0; i--) {
      if (JA_WOORDEN[tokens[i]]) return "gekend";
      if (NEE_WOORDEN[tokens[i]]) return "niet";
    }
    return null;
  }

  // Kort logboek van de spraakherkenning, te zien onder ⚙. Op een telefoon
  // is er geen console, dus zonder dit is niet te achterhalen waaróm de
  // herkenner stopt of een antwoord niet oppikt.
  const VOICE_LOG_MAX = 25;
  const voiceLog = [];
  function logVoice(text) {
    const d = new Date();
    const pad = function (n) { return ("0" + n).slice(-2); };
    voiceLog.push(pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "  " + text);
    if (voiceLog.length > VOICE_LOG_MAX) voiceLog.shift();
  }

  let recognition = null;        // lopende herkenner, of null
  let recognitionClosing = false; // vorige sessie sluit nog af
  let closeGuardTimer = null;    // vangnet als dat afsluiten blijft hangen
  let voiceActive = false;       // willen we luisteren?
  let voiceRestartTimer = null;
  // Hoe vaak start() achter elkaar mislukte. Begrensd, zodat een toestel dat
  // de microfoon niet vrijgeeft geen eindeloze reeks piepjes oplevert.
  let voiceStartFailures = 0;
  const MAX_START_FAILURES = 4;
  // Per herkende zin: welk antwoord daaruit al geteld is. De herkenner
  // levert dezelfde zin meermaals aan terwijl hij hem bijschaaft ("j" →
  // "ja" → "ja"), dus zonder dit zou één "ja" een paar keer meetellen.
  // Verandert het antwoord alsnog ("ja" → "ja nee"), dan telt dat wél.
  let actedAnswerForIndex = [];
  let voiceNetworkErrors = 0;
  let localVoiceReady = false;  // herkenning kan op het toestel zelf draaien

  // Chrome 139+ kan Nederlands op het toestel zelf herkennen; dan werkt de
  // spraakbediening óók zonder internet, net als de rest van de app. Alleen
  // inschakelen als het echt beschikbaar is — anders weigert de herkenner.
  if (SpeechRecognitionCtor && SpeechRecognitionCtor.available) {
    try {
      Promise.resolve(SpeechRecognitionCtor.available({ langs: ["nl-NL"], processLocally: true }))
        .then(function (res) { localVoiceReady = (res === "available"); })
        .catch(function () {});
    } catch (e) { /* oudere browser, gewoon de online-herkenning gebruiken */ }
  }

  function setVoiceHint(text) {
    voiceHint.textContent = text || "";
  }

  function startRecognition() {
    if (!SpeechRecognitionCtor || recognition) return;
    // Een vorige sessie die nog aan het afsluiten is, heeft de herkenner van
    // het toestel nog vast. Meteen een nieuwe starten mislukt dan of eindigt
    // direct weer — precies de start/stop-lus die je als piepjes hoort. De
    // onend van die vorige sessie start ons alsnog, zodra hij echt klaar is.
    if (recognitionClosing) { logVoice("wacht: vorige sessie sluit nog af"); return; }
    if (!voiceWindowOpen()) return;
    if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }

    const rec = new SpeechRecognitionCtor();
    rec.lang = "nl-NL";
    rec.continuous = true;      // blijven luisteren, niet na één zin stoppen
    rec.interimResults = true;  // al reageren vóór de zin "af" is: scheelt een seconde
    rec.maxAlternatives = 1;    // bij "ja"/"nee" voegt een tweede gok niets toe
    if (localVoiceReady) {
      try { rec.processLocally = true; } catch (e) {}
    }

    actedAnswerForIndex = [];

    rec.onresult = function (event) {
      voiceNetworkErrors = 0;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const heard = String(event.results[i][0].transcript || "").trim();
        const tokens = tokenize(heard);
        const tooLong = tokens.length > MAX_ANTWOORD_WOORDEN;
        const answer = (tokens.length && !tooLong) ? findAnswer(tokens) : null;
        if (!answer) {
          logVoice("gehoord: “" + heard + "” → " +
            (tooLong ? "te lang, genegeerd" : "geen ja/nee"));
          continue;
        }
        if (answer === actedAnswerForIndex[i]) continue; // al geteld
        actedAnswerForIndex[i] = answer;
        if (handleVoiceAnswer(answer)) {
          logVoice("gehoord: “" + heard + "” → geteld als " +
            (answer === "gekend" ? "GEKEND" : "NIET GEKEND"));
          break;
        }
        logVoice("gehoord: “" + heard + "” → buiten het antwoordvenster");
      }
    };

    rec.onerror = function (event) {
      const err = event && event.error;
      logVoice("fout: " + (err || "onbekend"));
      if (err === "not-allowed" || err === "service-not-allowed") {
        setVoiceEnabled(false);
        setVoiceHint("🎤 Geen toegang tot de microfoon — geef de app toestemming in de browserinstellingen.");
      } else if (err === "audio-capture") {
        // Geen bruikbare microfoon (of een andere app heeft hem). Niet in een
        // herstartlus blijven hangen.
        setVoiceEnabled(false);
        setVoiceHint("🎤 Geen microfoon beschikbaar — gebruikt een andere app hem misschien?");
      } else if (err === "language-not-supported") {
        setVoiceEnabled(false);
        setVoiceHint("🎤 Nederlandse spraakherkenning is op dit toestel niet beschikbaar.");
      } else if (err === "network") {
        // Zonder herkenning op het toestel zelf heeft de browser internet
        // nodig. Meteen laten zien wat er aan de hand is in plaats van drie
        // keer stil te blijven proberen — anders sta je te praten tegen een
        // app die het niet kan horen en weet je niet waarom.
        voiceNetworkErrors += 1;
        if (voiceNetworkErrors >= 3) {
          setVoiceEnabled(false);
          setVoiceHint("🎤 Spraakherkenning lukt hier niet zonder internet. Tik rood/groen, of probeer het weer met verbinding.");
        } else {
          setVoiceHint("🎤 Geen internet voor spraakherkenning — nog even proberen…");
        }
      }
      // "no-speech" en "aborted" zijn normaal: onend herstart vanzelf.
    };

    rec.onend = function () {
      logVoice("mic uit");
      if (recognition === rec) recognition = null;
      recognitionClosing = false; // het toestel heeft de herkenner weer vrij
      if (closeGuardTimer) { clearTimeout(closeGuardTimer); closeGuardTimer = null; }
      // Android sluit een sessie uit zichzelf af bij stilte. Alleen
      // herstarten als het antwoordvenster nog openstaat — anders zouden we
      // tijdens het volgende fragment weer gaan meeluisteren, met alle
      // piepjes en weggevallen geluid van dien.
      if (!voiceWindowOpen()) { updateVoiceStatusText(); return; }
      voiceRestartTimer = setTimeout(function () {
        voiceRestartTimer = null;
        startRecognition();
        updateVoiceStatusText();
      }, 300);
    };

    try {
      rec.start();
      recognition = rec;
      voiceStartFailures = 0;
      logVoice("mic aan (" + (localVoiceReady ? "op het toestel" : "via internet") + ")");
      updateVoiceStatusText();
    } catch (e) {
      // start() mislukt — het toestel houdt de herkenner nog vast. Er komt
      // geen onend voor deze herkenner, dus hier zelf een nieuwe poging
      // inplannen; zonder dat bleef de microfoon voorgoed uit voor dit woord.
      logVoice("starten mislukt: " + (e && e.name ? e.name : "onbekend"));
      voiceStartFailures += 1;
      if (voiceStartFailures > MAX_START_FAILURES) {
        // Blijven rammen op een herkenner die niet vrijkomt levert alleen
        // maar start/stop-piepjes op. Dit woord met tikken afhandelen; bij
        // het volgende woord krijgt de microfoon een schone kans.
        logVoice("opgegeven voor dit woord — microfoon komt niet vrij");
        updateVoiceStatusText(); // die kent deze stand, zie hieronder
        return;
      }
      // Oplopend wachten tussen de pogingen: 0,6 — 1,2 — 2,4 — 4,8 seconde.
      voiceRestartTimer = setTimeout(function () {
        voiceRestartTimer = null;
        startRecognition();
        updateVoiceStatusText();
      }, 600 * Math.pow(2, voiceStartFailures - 1));
    }
  }

  function stopRecognition() {
    if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
    const rec = recognition;
    recognition = null;
    if (!rec) return;
    // onend bewust NIET weghalen: we moeten juist weten wanneer het toestel
    // de herkenner echt heeft losgelaten. Tot die tijd blokkeert
    // recognitionClosing een nieuwe sessie. Dat onend ziet aan recognition
    // (al null) dat dit een bewuste stop is en herstart dus niet.
    recognitionClosing = true;
    // Vangnet: blijft onend onverhoopt uit, dan zou de microfoon voorgoed
    // geblokkeerd blijven. Na twee seconden gaan we er toch van uit dat het
    // toestel de herkenner heeft losgelaten.
    if (closeGuardTimer) clearTimeout(closeGuardTimer);
    closeGuardTimer = setTimeout(function () {
      closeGuardTimer = null;
      if (!recognitionClosing) return;
      logVoice("afsluiten duurde te lang — toch weer vrijgegeven");
      recognitionClosing = false;
      syncRecognition();
      updateVoiceStatusText();
    }, 2000);
    try {
      rec.abort();
    } catch (e) {
      recognitionClosing = false;
    }
  }

  // Tijdens het afspelen nemen we geen antwoord aan: in de auto komt het
  // fragment uit de autospeakers en hoort de microfoon het gewoon mee. Een
  // "ja" of "nee" in de betekenis van een woord zou dan voor jouw antwoord
  // doorgaan. Na afloop van het fragment is dat gevaar weg.
  function voiceGateOpen() {
    return state.phase === "answering" && fragmentFinished;
  }

  // Wanneer mag de microfoon daadwerkelijk aan staan? Precies zolang een
  // gesproken antwoord ook echt aangenomen wordt — niet langer.
  //
  // Eerder stond de herkenner continu aan, ook tijdens het fragment. Op
  // Android pakt die dan de audiofocus af van de speler (het fragment viel
  // weg of werd zachter) én speelt het toestel bij elke sessie zijn eigen
  // start/stop-piepjes. Omdat Android een sessie uit zichzelf afsluit bij
  // stilte en onend meteen herstartte, gaf dat een eindeloze reeks piepjes
  // dwars door het fragment heen, met een knipperend microfoon-icoontje in
  // de statusbalk. Luisteren tijdens het fragment leverde bovendien niets
  // op: voiceGateOpen() weigerde dat antwoord toch al.
  function voiceWindowOpen() {
    return voiceActive &&
      document.visibilityState === "visible" &&
      state.running &&
      voiceGateOpen();
  }

  // Zet de herkenner aan of uit zodat hij klopt met voiceWindowOpen().
  // Bewust zonder het bijschrift aan te raken: de aanroepers bepalen zelf
  // wat er moet staan (bijvoorbeeld "Gehoord: ja" na een antwoord).
  function syncRecognition() {
    if (voiceWindowOpen()) startRecognition();
    else stopRecognition();
  }

  function handleVoiceAnswer(answer) {
    if (!voiceGateOpen()) return false;
    setVoiceHint("🎤 Gehoord: “" + (answer === "gekend" ? "ja" : "nee") + "”");
    registerResult(answer, state.session);
    return true;
  }

  function updateVoiceStatusText() {
    if (!voiceActive) { setVoiceHint(""); return; }
    if (!state.running) { setVoiceHint("🎤 Spraakbediening aan"); return; }
    if (!voiceGateOpen()) {
      setVoiceHint("🎤 Zeg “ja” of “nee” zodra het fragment klaar is");
      return;
    }
    if (voiceStartFailures > MAX_START_FAILURES) {
      // Opgegeven voor dit woord: niet laten denken dat er geluisterd wordt.
      setVoiceHint("🎤 Microfoon komt niet vrij — tik rood of groen");
      return;
    }
    // De herkenner heeft na het starten even nodig voor hij echt luistert;
    // dat verschil hier laten zien in plaats van alvast "Luistert" beloven.
    setVoiceHint(recognition ? "🎤 Luistert — zeg “ja” of “nee”" : "🎤 Microfoon start…");
  }

  // De microfoon gaat nu pas aan ná een fragment. Vraag de toestemming
  // daarom alvast bij het aantikken van 🎤 — dat is een bewuste handeling —
  // in plaats van de gebruiker er middenin een beurt mee te overvallen. De
  // stream wordt meteen weer losgelaten; het gaat puur om de toestemming.
  function primeMicPermission() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        stream.getTracks().forEach(function (track) { track.stop(); });
      })
      .catch(function () { /* geweigerd: onerror van de herkenner meldt het */ });
  }

  function setVoiceEnabled(on) {
    state.voiceEnabled = !!on;
    voiceActive = state.voiceEnabled;
    saveState();
    voiceBtn.classList.toggle("on", voiceActive);
    voiceBtn.setAttribute("aria-pressed", voiceActive ? "true" : "false");
    if (voiceActive) {
      voiceNetworkErrors = 0;
      syncRecognition();
      updateVoiceStatusText();
      requestQuizWakeLock();
    } else {
      stopRecognition();
      releaseQuizWakeLock();
      setVoiceHint("");
    }
  }

  // Zonder dit valt het scherm tijdens een handsfree beurt in slaap, wordt
  // de pagina bevroren en luistert er niets meer mee — precies wanneer je
  // het scherm juist níet kunt aanraken.
  let quizWakeLock = null;
  function requestQuizWakeLock() {
    if (quizWakeLock || !navigator.wakeLock) return;
    if (!voiceActive || !state.running) return;
    if (document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (lock) {
      quizWakeLock = lock;
      lock.addEventListener("release", function () { quizWakeLock = null; });
    }).catch(function () { /* mag geweigerd worden */ });
  }
  function releaseQuizWakeLock() {
    if (!quizWakeLock) return;
    const lock = quizWakeLock;
    quizWakeLock = null;
    try { lock.release(); } catch (e) {}
  }

  if (SpeechRecognitionCtor) {
    voiceBtn.hidden = false;
    voiceBtn.addEventListener("click", function () {
      const on = !voiceActive;
      // Alleen bij een bewuste tik toestemming vragen — niet bij elke start
      // van de app, want dan zou de microfoon-indicator onnodig oplichten.
      if (on) primeMicPermission();
      setVoiceEnabled(on);
    });
    voiceInfo.textContent =
      "🎤 in de bedieningsbalk zet spraakbediening aan: antwoord dan met “ja” (gekend) of " +
      "“nee” (niet gekend) in plaats van rood/groen te tikken — handig in de auto. De " +
      "microfoon gaat pas aan ná het fragment en meteen weer uit zodra je antwoord " +
      "geteld is: tijdens het fragment zou de microfoon het fragment zelf als antwoord " +
      "kunnen opvatten, en zou hij op Android het geluid onderbreken. Het scherm blijft " +
      "aan zolang dit aan staat, en tikken blijft gewoon werken.";
    // Eerder aangezet? Dan meteen weer luisteren. De microfoontoestemming is
    // dan al gegeven, dus daar komt geen nieuwe vraag voor.
    if (state.voiceEnabled) setVoiceEnabled(true);
  } else {
    voiceInfo.textContent = "Deze browser ondersteunt geen spraakherkenning, dus spraakbediening (“ja”/“nee”) is hier niet beschikbaar.";
  }

  document.addEventListener("visibilitychange", function () {
    // syncRecognition() kijkt zelf naar de zichtbaarheid: naar de
    // achtergrond betekent microfoon uit, terug betekent alleen weer aan
    // als er op dat moment ook echt op een antwoord gewacht wordt.
    syncRecognition();
    updateVoiceStatusText();
    if (document.visibilityState === "visible") {
      requestQuizWakeLock(); // een wake lock vervalt zodra de app naar de achtergrond gaat
    }
  });

  // ---------------------------------------------------------------------
  // Woordwachtrij: "niet gekend" komt vaker terug
  // ---------------------------------------------------------------------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildQueue() {
    const list = [];
    WORDS.forEach(function (word) {
      list.push(word);
      const last = state.lastResults[word.id];
      if (last === "niet") { list.push(word); list.push(word); }
    });
    return shuffle(list);
  }

  // ---------------------------------------------------------------------
  // Quiz flow
  // ---------------------------------------------------------------------
  function startQuiz() {
    if (!WORDS.length || state.running) return;
    state.running = true;
    state.session += 1;
    const session = state.session;
    state.roundCounts = { gekend: 0, niet: 0 };
    state.queue = buildQueue();
    state.queueIndex = -1;
    startBtn.textContent = "Stop quiz";
    settingsBtn.disabled = true;
    requestQuizWakeLock();
    playNext(session); // zet zelf de microfoon in de juiste stand
  }

  function stopQuiz() {
    state.running = false;
    state.session += 1; // maakt alle nog lopende callbacks van deze sessie ongeldig
    if (state.nextTimer) { clearTimeout(state.nextTimer); state.nextTimer = null; }
    player.pause();
    state.phase = "idle";
    startBtn.textContent = "Start quiz";
    settingsBtn.disabled = false;
    replayBtn.disabled = true;
    setZonesActive(false);
    syncRecognition();
    updateVoiceStatusText();
    releaseQuizWakeLock();
    statusText.textContent = "Quiz gestopt. Start opnieuw wanneer je wil.";
    showPendingUpdatePrompt();
  }

  let currentBlobUrl = null;
  function releaseBlobUrl() {
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  }

  // Leest een gecachet mp3-fragment zelf uit Cache Storage en speelt het af
  // via een Blob-URL, in plaats van player.src rechtstreeks op de mp3-url
  // te zetten. Directe <audio>-fetches lopen via het mediaelement zelf en
  // worden op sommige Android/Chrome-versies niet betrouwbaar door de
  // service worker opgevangen zodra er geen netwerk is — dit omzeilt dat.
  function resolvePlayableSrc(file) {
    if (!hasCacheStorage) return Promise.resolve(file);
    return openMp3Cache()
      .then(function (cache) { return cache.match(absUrl(file)); })
      .then(function (res) { return res ? res.blob() : null; })
      .then(function (blob) { return blob ? URL.createObjectURL(blob) : file; })
      .catch(function () { return file; });
  }

  // Melding als een fragment niet uit de offline-opslag komt. Zegt erbij
  // hoeveel er in totaal ontbreken, zodat meteen duidelijk is of dit één
  // uitschieter is of een half afgebroken download.
  function notDownloadedMessage() {
    if (missingCount) {
      return "Dit fragment is nog niet gedownload — " + missingCount + " van de " +
        WORDS.length + " fragmenten ontbreken. Ga naar ⚙ en tik op \"Mp3's nu downloaden\" met wifi.";
    }
    return "Dit fragment kon niet afgespeeld worden. Ga naar ⚙ voor de download-status.";
  }

  // true zodra het huidige fragment is uitgespeeld (of onspeelbaar bleek).
  // Bewust een eigen vlag en niet player.paused: tussen "volgend woord" en
  // het werkelijke begin van het geluid staat de speler ook even op pauze,
  // en dan zou de microfoon onnodig even aan- en meteen weer uitgaan.
  let fragmentFinished = false;

  function playCurrent() {
    const word = state.currentWord;
    fragmentFinished = false;
    voiceStartFailures = 0; // nieuw woord: de microfoon krijgt een schone kans
    syncRecognition();      // microfoon uit zolang het fragment speelt
    resolvePlayableSrc(word.file).then(function (src) {
      const fromCache = src.indexOf("blob:") === 0;
      if (state.currentWord !== word) {
        // Ondertussen al doorgegaan naar een ander woord: deze blob-url
        // wordt nooit meer gebruikt, dus meteen opruimen.
        if (fromCache) URL.revokeObjectURL(src);
        return;
      }
      releaseBlobUrl();
      if (fromCache) currentBlobUrl = src;
      player.src = src;
      player.currentTime = 0;
      player.play().catch(function (err) {
        const name = err && err.name;
        if (name === "AbortError") return; // we zijn zelf al verder gegaan
        // Er komt geen geluid, dus ook geen gevaar dat de microfoon het
        // fragment zelf als antwoord opvat: luisteren mag nu wel. Zonder dit
        // zou een onspeelbaar fragment de spraakbediening laten hangen.
        fragmentFinished = true;
        syncRecognition();
        if (name === "NotAllowedError") {
          statusText.textContent = "Tik ergens op het scherm om afspelen toe te staan.";
        } else if (!fromCache) {
          statusText.textContent = notDownloadedMessage();
        } else {
          statusText.textContent = "Afspelen van dit fragment mislukte (" + (name || "onbekende fout") + ").";
        }
      });
    });
  }

  function playNext(session) {
    if (session !== state.session) return;
    state.queueIndex += 1;
    if (state.queueIndex >= state.queue.length) {
      finishRound(session);
      return;
    }
    state.currentWord = state.queue[state.queueIndex];
    state.phase = "answering";
    updateVoiceStatusText(); // "Gehoord: ja" van het vorige woord weghalen
    setZonesActive(true);
    replayBtn.disabled = false;
    statusText.textContent = voiceActive
      ? "Zeg “ja” of “nee” na het fragment — tikken mag meteen."
      : "Kies zodra je het weet — hoeft niet te wachten tot het einde.";
    playCurrent();
  }

  player.addEventListener("ended", function () {
    if (state.phase !== "answering") return;
    fragmentFinished = true;
    syncRecognition();       // nu pas de microfoon aanzetten
    updateVoiceStatusText(); // vanaf nu neemt de spraakbediening wél antwoord aan
    statusText.textContent = voiceActive
      ? "Kende je dit woord? Zeg “ja” of “nee”, of tik rood/groen."
      : "Kende je dit woord? Tik rood of groen.";
  });

  // Loopt het afspelen ergens halverwege vast, dan komt "ended" nooit en zou
  // de spraakbediening voorgoed blijven wachten. Behandel het als klaar.
  player.addEventListener("error", function () {
    if (state.phase !== "answering") return;
    fragmentFinished = true;
    syncRecognition();
    updateVoiceStatusText();
  });

  // Zolang er geluid speelt luistert de spraakbediening niet mee; dat hier
  // bijwerken zodat het bijschrift altijd klopt (ook na 🔁).
  player.addEventListener("playing", function () {
    syncRecognition();
    updateVoiceStatusText();
  });

  function registerResult(result, session) {
    if (session !== state.session) return;
    if (state.phase !== "answering") return;
    player.pause();
    setZonesActive(false);
    replayBtn.disabled = true;
    if (result === "gekend") playTone("ping"); else playTone("buzz");

    state.lastResults[state.currentWord.id] = result;
    state.roundCounts[result] += 1;
    saveState();
    updateScoreOverview();

    state.phase = "idle";
    syncRecognition(); // antwoord binnen: microfoon uit tot na het volgende fragment
    state.nextTimer = setTimeout(function () { playNext(session); }, state.pauseMs);
  }

  function finishRound(session) {
    if (session !== state.session) return;
    state.lastRoundCounts = {
      gekend: state.roundCounts.gekend,
      niet: state.roundCounts.niet
    };
    saveState();
    updateScoreOverview();

    const c = state.roundCounts;
    statusText.textContent = "Beurt klaar: " + c.gekend + " gekend, " + c.niet + " niet gekend.";
    startBtn.textContent = "Start quiz";
    settingsBtn.disabled = false;
    state.phase = "idle";
    state.running = false;
    setZonesActive(false);
    replayBtn.disabled = true;
    syncRecognition();
    releaseQuizWakeLock();
    showPendingUpdatePrompt();
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------
  function handleZoneTap(result) {
    if (state.phase === "answering") {
      registerResult(result, state.session);
    }
  }

  redZone.addEventListener("click", function () { handleZoneTap("niet"); });
  greenZone.addEventListener("click", function () { handleZoneTap("gekend"); });

  replayBtn.addEventListener("click", function () {
    if (state.phase === "answering" && state.currentWord) playCurrent();
  });

  startBtn.addEventListener("click", function () {
    if (!state.running) startQuiz();
    else stopQuiz();
  });

  function updateDebugInfo() {
    const conn = getConnection();
    const type = conn && conn.type;
    const statusLabel =
      type === "wifi" ? "wifi (bevestigd)" :
      type === "none" ? "geen verbinding" :
      type ? "mobiel internet (bevestigd)" :
      "onbekend";
    const cached = missingCount === null
      ? "onbekend (cache niet uitleesbaar)"
      : (WORDS.length - missingCount) + " / " + WORDS.length + " (" + missingCount + " ontbreken)";
    const voiceMode = !SpeechRecognitionCtor
      ? "niet beschikbaar in deze browser"
      : (localVoiceReady ? "op het toestel zelf (werkt offline)" : "via internet (de browser stuurt het geluid op)");
    voiceLogInfo.textContent = voiceLog.length
      ? "Spraaklogboek (nieuwste onderaan):\n" + voiceLog.join("\n")
      : "Spraaklogboek: nog niets opgenomen.";

    debugInfo.textContent =
      "Versie: " + (activeVersion || "onbekend") + (waitingWorker ? " (update klaar om te installeren)" : "") + "\n" +
      "Spraakherkenning: " + voiceMode + "\n" +
      "Woorden: " + WORDS.length + "\n" +
      "Echt in offline-opslag: " + cached + "\n" +
      "Gedetecteerde verbinding: " + statusLabel + " (connection.type: " + (conn && conn.type ? conn.type : "niet beschikbaar") + ")\n" +
      "Service worker actief: " + (navigator.serviceWorker && navigator.serviceWorker.controller ? "ja" : "nee");
  }

  settingsBtn.addEventListener("click", function () {
    askActiveVersion();
    updateDebugInfo();
    settingsModal.classList.remove("hidden");
    // Hertellen kost even; zodra het klaar is staat het juiste aantal er.
    refreshSyncState().then(updateDebugInfo);
  });
  closeSettingsBtn.addEventListener("click", function () {
    settingsModal.classList.add("hidden");
  });

  resetProgressBtn.addEventListener("click", function () {
    state.lastResults = {};
    state.lastRoundCounts = null;
    saveState();
    updateScoreOverview();
    settingsModal.classList.add("hidden");
  });

  exportProgressBtn.addEventListener("click", function () {
    const data = {
      type: "bergs-quiz-voortgang",
      exportedAt: new Date().toISOString(),
      lastResults: state.lastResults,
      lastRoundCounts: state.lastRoundCounts
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "dieje-lekt-voortgang.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importProgressBtn.addEventListener("click", function () {
    importProgressInput.click();
  });

  importProgressInput.addEventListener("change", function () {
    const file = importProgressInput.files[0];
    importProgressInput.value = ""; // zodat hetzelfde bestand later opnieuw gekozen kan worden
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let data;
      try {
        data = JSON.parse(reader.result);
      } catch (e) {
        alert("Dit bestand kon niet gelezen worden — is het wel een eerder geëxporteerd voortgangsbestand?");
        return;
      }
      if (!data || typeof data.lastResults !== "object" || data.lastResults === null) {
        alert("Dit bestand bevat geen geldige voortgang.");
        return;
      }
      const count = Object.keys(data.lastResults).length;
      if (!confirm("Dit vervangt je huidige voortgang door de " + count + " woorden uit dit bestand. Doorgaan?")) return;
      state.lastResults = data.lastResults;
      state.lastRoundCounts = data.lastRoundCounts || null;
      saveState();
      updateScoreOverview();
      settingsModal.classList.add("hidden");
      alert("Voortgang geïmporteerd (" + count + " woorden).");
    };
    reader.readAsText(file);
  });

  forceDownloadBtn.addEventListener("click", function () {
    downloadMp3Btn.hidden = true;
    cacheProgressWrap.hidden = false;
    cacheProgressFill.style.width = "0%";
    cacheProgressText.textContent = "Downloaden geforceerd gestart...";
    syncMp3s(true);
    settingsModal.classList.add("hidden");
  });

  pauseInput.addEventListener("change", function () {
    let val = parseInt(pauseInput.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 10) val = 10;
    state.pauseMs = val * 1000;
    pauseInput.value = val;
    saveState();
  });
})();
</script>
</body>
</html>
